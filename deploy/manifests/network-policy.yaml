apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-server-same-namespace
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
